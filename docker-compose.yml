services:
  youtube-rag-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: youtube-rag-dev
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - PRELOAD_WHISPER_MODEL=tiny
    env_file:
      - .env
    volumes:
      # Mount source code for hot reload
      - .:/app
      # Don't override venv
      - /opt/venv
      # Cache for faster restarts
      - whisper-cache:/home/streamlit/.cache/whisper
    restart: unless-stopped
    # Override CMD for development with hot reloading
    command: streamlit run YouTube_Video_Q_N_A/app.py --server.port=8501 --server.address=0.0.0.0 --server.runOnSave=true

volumes:
  whisper-cache:
    driver: local