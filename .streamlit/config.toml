[server]
port = 8501
address = "0.0.0.0"
headless = true
runOnSave = false
maxUploadSize = 200
enableCORS = false
enableXsrfProtection = true
enableWebsocketCompression = true
fileWatcherType = "poll"

[browser]
gatherUsageStats = false
serverAddress = "0.0.0.0"

[theme]
primaryColor = "#FF4B4B"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F2F6"
textColor = "#262730"

[logger]
level = "info"

[client]
showErrorDetails = false
toolbarMode = "minimal"